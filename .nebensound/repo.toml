# A temporary caller of the central pipeline, for measuring its runs.
[repo]
audience = "public"
minimum-version = "0.1.0"
pipeline = "none"

[component.notes]
path = "notes"
pipeline = "none"

# A program whose release carries its archives.
[component.app]
path = "app"
pipeline = "rust-binary"

# Two libraries for the private registry, `pkg` requiring `lib` by path: the
# base of a pull request that shows `unreleased-requirement`.
[component.lib]
path = "lib"
pipeline = "rust-library"

[component.pkg]
path = "pkg"
pipeline = "rust-library"
